name: chris-devstrap CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: bash -n on bootstrap and scripts
        run: |
          set -euo pipefail
          bash -n bootstrap.sh install.sh
          for f in scripts/*.sh; do
            bash -n "$f"
          done
          echo "OK: bash -n passed"
      - name: shellcheck (pinned release, -S warning)
        env:
          SC_VERSION: v0.10.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.txz \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.txz -C /tmp
          chmod +x "/tmp/shellcheck-${SC_VERSION}/shellcheck"
          # E2: warning severity (was: default = style). .shellcheckrc still disables SC1091 for dynamic source paths.
          "/tmp/shellcheck-${SC_VERSION}/shellcheck" -S warning -x bootstrap.sh install.sh scripts/*.sh
          echo "OK: shellcheck passed"

  macos-smoke:
    runs-on: macos-latest
    needs: bash-syntax
    steps:
      - uses: actions/checkout@v5
      - name: macOS /bin/bash 3.2 syntax check (E4)
        run: |
          set -euo pipefail
          /bin/bash --version | head -1
          /bin/bash -n bootstrap.sh install.sh
          for f in scripts/*.sh; do
            /bin/bash -n "$f"
          done
          echo "OK: /bin/bash 3.2 syntax check passed"
      - name: Regression — remote clt.sh load under bash 3.2 (curl|bash path)
        run: |
          set -euo pipefail
          # Stock macOS /bin/bash is 3.2: `source <(...)` is a known no-op. install.sh
          # must load scripts/clt.sh via a real file (mktemp), not process substitution.
          if /bin/bash -c 'source <(printf "%s\n" "chris_clt_probe(){ :; }"); declare -F chris_clt_probe' 2>/dev/null; then
            echo "NOTE: this bash defines functions via source <(...) (unusual for stock 3.2)"
          else
            echo "OK: confirmed source <(...) does not define functions on this bash"
          fi
          _f="$(mktemp "${TMPDIR:-/tmp}/chris-devstrap-clt-ci.XXXXXX")"
          cp scripts/clt.sh "$_f"
          /bin/bash -c '
            set -euo pipefail
            source "$1"
            declare -F chris_clt_require >/dev/null
            declare -F chris_clt_require_git >/dev/null
            echo "OK: temp-file source defines chris_clt_require under /bin/bash"
          ' bash "$_f"
          rm -f "$_f"
      - name: bootstrap.sh --dry-run smoke (E1)
        env:
          # Keep CI runs hermetic: don't poll for CLT, don't try to install heavy bundles,
          # skip the headshot dscl path, and stay non-interactive.
          CHRIS_DEVSTRAP_WAIT_CLT: '0'
          CHRIS_DEVSTRAP_SKIP_HEAVY: '1'
          CHRIS_DEVSTRAP_SKIP_HEADSHOT: '1'
          CHRIS_DEVSTRAP_SKIP_MANUAL_GUIDE: '1'
          CHRIS_DEVSTRAP_SKIP_DEFAULT_BROWSER: '1'
          CHRIS_DEVSTRAP_SKIP_SUDO_PRIME: '1'
          CHRIS_DEVSTRAP_SKIP_SSH: '1'
          CHRIS_DEVSTRAP_SKIP_SBEDIT_INSTALL: '1'
          CHRIS_DEVSTRAP_SKIP_ITERM_REUSE_DIRECTORY: '1'
        run: |
          set -euo pipefail
          chmod +x bootstrap.sh scripts/*.sh
          ./bootstrap.sh --dry-run
          echo "OK: bootstrap.sh --dry-run completed"

  readme-links:
    runs-on: ubuntu-latest
    needs: bash-syntax
    steps:
      - uses: actions/checkout@v5
      - name: Link check README.md (E3)
        uses: lycheeverse/lychee-action@v2
        with:
          # Stay tolerant: external sites and GitHub anchors are best-effort.
          args: --no-progress --max-concurrency 4 --accept 200,206,429 README.md
          fail: false
